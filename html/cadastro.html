<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro - ONG Páginas do Amanhã</title>
    
    <!-- AQUI ESTÁ A TUBULAÇÃO DE TINTA LIGADA! -->
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>

    <!-- A PLACA DE ENTRADA (Menu) -->
    <header class="cabecalho-menu">
        <h2 style="color: var(--cor-secundaria);">Páginas do Amanhã</h2>
        <input type="checkbox" id="menu-toggle" class="menu-checkbox">
        <label for="menu-toggle" class="menu-hamburguer">☰</label>
        <ul class="navegacao-links">
            <li><a href="index.html">Início</a></li>
            <li><a href="projetos.html">Projetos</a></li>
            <li><a href="cadastro.html">Apoiar</a></li>
        </ul>
    </header>

    <!-- O CHÃO DE FÁBRICA (Formulário) -->
    <main style="max-width: 800px; margin: 40px auto; padding: 20px;">
        <section id="formulario">
            <h1 style="margin-bottom: 20px;">Registo de Voluntários e Doadores</h1>
            
            <form action="#" method="POST">
                
                <!-- Primeira Zona: Dados Pessoais -->
                <fieldset style="padding: 20px; border: 2px solid var(--cor-primaria); border-radius: 8px; margin-bottom: 20px;">
                    <legend style="font-weight: bold; color: var(--cor-secundaria); padding: 0 10px;">Dados de Identificação</legend>

                    <label for="nome">Nome Completo:</label><br>
                    <input type="text" id="nome" name="nome" required><br><br>

                    <label for="email">E-mail:</label><br>
                    <input type="email" id="email" name="email" required><br><br>

                    <label for="cpf">CPF (apenas números):</label><br>
                    <input type="text" id="cpf" name="cpf" pattern="\d{11}" maxlength="11" title="Digite apenas os 11 números" required><br><br>
                </fieldset>

                <!-- Segunda Zona: Preferências -->
                <fieldset style="padding: 20px; border: 2px solid var(--cor-primaria); border-radius: 8px; margin-bottom: 20px;">
                    <legend style="font-weight: bold; color: var(--cor-secundaria); padding: 0 10px;">Localização e Preferências</legend>

                    <label for="cep">CEP:</label><br>
                    <input type="text" id="cep" name="cep" pattern="\d{8}" maxlength="8" title="Digite apenas os 8 números" required><br><br>

                    <label style="font-weight: bold;">Como deseja ajudar?</label><br><br>
                    <input type="radio" id="doar" name="tipo_ajuda" value="doacao" required>
                    <label for="doar">Tenho livros para doar</label><br><br>
                    
                    <input type="radio" id="voluntario" name="tipo_ajuda" value="voluntariado">
                    <label for="voluntario">Quero ser voluntário (Rodas de leitura)</label><br><br>
                </fieldset>

                <!-- O botão agora tem a classe mágica! -->
                <button type="submit" class="botao-magico">Enviar Cadastro</button>

            </form>
        </section>
    </main>
</body>
</html>
